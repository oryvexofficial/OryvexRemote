name: Build ScreenBridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r windows/requirements.txt pyinstaller
      - name: Run TLS checks
        run: python tests/test_tls_integration.py
      - name: Run source checks
        run: python tests/test_project_static.py
      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name ScreenBridge --icon windows/icon.ico --add-data "windows/icon.png;." --add-data "windows/Manrope-Regular.ttf;." --add-data "windows/Manrope-Bold.ttf;." windows/main.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenBridge-Windows
          if-no-files-found: error
          path: |
            dist/ScreenBridge.exe
            installer/ScreenBridge-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenBridge-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.0-auto.${{ github.run_number }}.${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Automatic development build ${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Automated development build. Windows binaries are unsigned and the APK
            uses a debug signing key. Test before use. LAN pairing does not verify
            host identity and is vulnerable to active network interception.
          files: |
            ScreenBridge-Windows/**/*.exe
            ScreenBridge-Android/*.apk
